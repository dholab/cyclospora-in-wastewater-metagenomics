[workspace]
authors = ["DHO-CHTC <dhoconno@wisc.edu>"]
channels = ["conda-forge", "bioconda"]
name = "cyclospora-wastewater-screen"
platforms = ["linux-64", "linux-aarch64", "osx-arm64"]
version = "0.1.0"

[tasks]
# Re-derive the threshold table from the committed per-read evidence.
# Pure Python, no database, no network. Takes under a second.
sweep = "python scripts/sweep_threshold.py"
# Rebuild the compact bait-topology and calibration-evidence summary.
# Pure Python over committed inputs; no database or network.
summarize-bait-calibration = "python scripts/summarize_bait_calibration.py"
# Freeze the primary public outputs from a returned NVD screen.
import-nvd-screen = "python scripts/import_nvd_screen.py"
# Recount the frozen screen and regenerate the per-run summary and read evidence.
summarize-nvd-screen = "python scripts/summarize_nvd_screen.py"
# Render the matrix and heatmap from the committed summary evidence.
plot-heatmap = "python scripts/plot_heatmap.py"
# Recount first, then render the resulting summary.
rebuild-screen-artifacts = { cmd = "python scripts/plot_heatmap.py", depends-on = ["summarize-nvd-screen"] }

[dependencies]
python = ">=3.12,<3.13"
# filters reads against the stage 01 bait index
deacon = ">=0.15.0,<0.17"
# only needed to repeat the calibration-read core-nt search yourself
blast = ">=2.15,<3"
